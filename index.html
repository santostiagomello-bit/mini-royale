
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mini Royale</title>
<style>
* { box-sizing: border-box; }
body { margin:0; overflow:hidden; background:#18251d; font-family:Arial,sans-serif; touch-action:none; }
canvas { display:block; }
#title { position:fixed; top:12px; left:50%; transform:translateX(-50%); color:white; font-weight:bold; font-size:22px; text-shadow:2px 2px 4px black; z-index:2; }
#pad { position:fixed; bottom:25px; left:25px; width:120px; height:120px; border-radius:50%; background:#ffffff40; border:2px solid #ffffff80; z-index:3; touch-action:none; }
#stick { position:absolute; width:48px; height:48px; left:34px; top:34px; border-radius:50%; background:#eeeeeecc; border:2px solid white; }
#hint { position:fixed; bottom:12px; right:15px; color:white; font-size:12px; text-shadow:1px 1px 3px black; }
</style>
</head>
<body>
<div id="title">MINI ROYALE</div>
<div id="pad"><div id="stick"></div></div>
<div id="hint">Arraste o joystick para andar</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// CENA
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9bc9dc);
const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0,15,15);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// LUZES
scene.add(new THREE.HemisphereLight(0xffffff,0x536344,2));
const sun = new THREE.DirectionalLight(0xffffff,2);
sun.position.set(8,15,8);
sun.castShadow = true;
scene.add(sun);

// CHAO
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(50,50),
  new THREE.MeshStandardMaterial({color:0x559447})
);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

const path = new THREE.Mesh(
  new THREE.PlaneGeometry(8,50),
  new THREE.MeshStandardMaterial({color:0xb5a078})
);
path.rotation.x=-Math.PI/2;
path.position.set(0,0.02,0);
scene.add(path);

// OBJETOS DO MAPA
function box(x,y,z,sx,sy,sz,color) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(sx,sy,sz),
    new THREE.MeshStandardMaterial({color})
  );
  mesh.position.set(x,y,z);
  mesh.castShadow=true;
  mesh.receiveShadow=true;
  scene.add(mesh);
  return mesh;
}

function tree(x,z) {
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.18,0.25,1.4,7),
    new THREE.MeshStandardMaterial({color:0x70452a})
  );
  trunk.position.set(x,0.7,z);
  trunk.castShadow=true;
  scene.add(trunk);

  const leaves = new THREE.Mesh(
    new THREE.ConeGeometry(1.15,2.5,7),
    new THREE.MeshStandardMaterial({color:0x236b35})
  );
  leaves.position.set(x,2.35,z);
  leaves.castShadow=true;
  scene.add(leaves);
}

[[-10,-9],[-13,-3],[-10,7],[-13,13],[10,-10],[13,-4],[11,6],[14,13],[-7,15],[7,16],[-16,5],[16,4]].forEach(p=>tree(p[0],p[1]));

function house(x,z,color) {
  box(x,1,z,4,2,4,color);
  const roof = new THREE.Mesh(
    new THREE.ConeGeometry(3.1,2,4),
    new THREE.MeshStandardMaterial({color:0x713c2c})
  );
  roof.position.set(x,3,z);
  roof.rotation.y=Math.PI/4;
  roof.castShadow=true;
  scene.add(roof);
  box(x,0.9,z+2.02,0.9,1.8,0.08,0x49301e);
}

house(-7,-5,0xd7c18c);
house(8,7,0xc5b28a);
house(7,-10,0xb9c4a0);

for(let i=0;i<12;i++) {
  const rock = new THREE.Mesh(
    new THREE.DodecahedronGeometry(0.5+Math.random()*0.5),
    new THREE.MeshStandardMaterial({color:0x777b70})
  );
  rock.position.set(
    (Math.random()-0.5)*35,
    0.35,
    (Math.random()-0.5)*35
  );
  rock.castShadow=true;
  scene.add(rock);
}

// PERSONAGEM FUTURISTA 3D CARTOON
const player = new THREE.Group();
scene.add(player);

function part(geometry,color,x,y,z,parent=player,emissive=0x000000) {
  const material = new THREE.MeshStandardMaterial({
    color,
    emissive,
    emissiveIntensity:emissive?0.8:0,
    metalness:emissive?0.25:0.05,
    roughness:0.65
  });
  const mesh = new THREE.Mesh(geometry,material);
  mesh.position.set(x,y,z);
  mesh.castShadow=true;
  mesh.receiveShadow=true;
  parent.add(mesh);
  return mesh;
}

const armor = 0x263a32;
const armorLight = 0x40584a;
const black = 0x151d1b;
const neon = 0x54ff72;
const metal = 0x899b91;

// TRONCO E ARMADURA CENTRAL
part(new THREE.BoxGeometry(0.76,0.82,0.42),armor,0,1.22,0);
part(new THREE.BoxGeometry(0.66,0.55,0.12),armorLight,0,1.27,-0.245);
part(new THREE.BoxGeometry(0.48,0.34,0.045),black,0,1.31,-0.32);

// LINHAS LUMINOSAS DO PEITO
part(new THREE.BoxGeometry(0.045,0.38,0.025),neon,-0.25,1.30,-0.35,player,neon);
part(new THREE.BoxGeometry(0.045,0.38,0.025),neon,0.25,1.30,-0.35,player,neon);
part(new THREE.BoxGeometry(0.22,0.07,0.035),metal,0,1.56,-0.33);

// GOLA E MODULO NAS COSTAS
part(new THREE.CylinderGeometry(0.16,0.18,0.17,10),black,0,1.68,0);
part(new THREE.BoxGeometry(0.42,0.48,0.16),black,0,1.25,0.27);
part(new THREE.BoxGeometry(0.24,0.08,0.035),neon,0,1.35,0.36,player,neon);
part(new THREE.BoxGeometry(0.12,0.12,0.04),metal,0,1.12,0.36);

// PLACAS DOS OMBROS
for(const side of [-1,1]) {
  const shoulder = part(
    new THREE.SphereGeometry(0.25,12,9),
    armorLight,side*0.43,1.49,0
  );
  shoulder.scale.set(1.12,0.78,1.12);
  part(
    new THREE.BoxGeometry(0.22,0.055,0.24),
    neon,side*0.43,1.52,-0.13,player,neon
  );
}

// CINTO E PEQUENOS EQUIPAMENTOS
part(new THREE.BoxGeometry(0.8,0.13,0.47),black,0,0.88,0);
part(new THREE.BoxGeometry(0.17,0.12,0.04),metal,0,0.88,-0.25);

for(const side of [-1,1]) {
  part(new THREE.BoxGeometry(0.18,0.22,0.18),armorLight,side*0.43,0.88,0);
  part(new THREE.BoxGeometry(0.08,0.035,0.025),neon,side*0.43,0.90,-0.10,player,neon);
}

// PERNAS COM JOELHEIRAS TECNOLOGICAS
const legL = new THREE.Group();
legL.position.set(-0.22,0.8,0);
player.add(legL);

const legR = new THREE.Group();
legR.position.set(0.22,0.8,0);
player.add(legR);

for(const leg of [legL,legR]) {
  part(new THREE.CylinderGeometry(0.16,0.17,0.65,10),armor,0,-0.32,0,leg);
  part(new THREE.BoxGeometry(0.22,0.24,0.12),armorLight,0.12,-0.30,-0.02,leg);
  part(new THREE.BoxGeometry(0.29,0.19,0.14),black,0,-0.49,-0.13,leg);
  part(new THREE.BoxGeometry(0.20,0.055,0.035),neon,0,-0.49,-0.21,leg,neon);
  part(new THREE.CylinderGeometry(0.14,0.15,0.25,10),armorLight,0,-0.57,0,leg);
  part(new THREE.BoxGeometry(0.33,0.21,0.44),black,0,-0.68,-0.08,leg);
  part(new THREE.BoxGeometry(0.34,0.055,0.45),armorLight,0,-0.78,-0.08,leg);
  part(new THREE.BoxGeometry(0.10,0.07,0.025),neon,0,-0.66,-0.31,leg,neon);
}

// CABECA E CAPACETE COM VISOR
part(new THREE.SphereGeometry(0.31,16,12),0x303b36,0,1.86,0);
part(new THREE.CylinderGeometry(0.12,0.13,0.18,10),black,0,1.66,0);
part(new THREE.SphereGeometry(0.39,16,10,0,Math.PI*2,0,Math.PI/2),armor,0,2.05,0);
part(new THREE.CylinderGeometry(0.4,0.4,0.09,16),black,0,1.99,0);

// VISOR NA FRENTE DO CAPACETE
part(new THREE.BoxGeometry(0.48,0.16,0.055),black,0,1.91,-0.285);
part(new THREE.BoxGeometry(0.39,0.055,0.025),neon,0,1.92,-0.32,player,neon);
part(new THREE.BoxGeometry(0.13,0.08,0.08),metal,0,2.18,-0.19);

for(const side of [-1,1]) {
  part(new THREE.CylinderGeometry(0.09,0.09,0.07,10),metal,side*0.37,2.00,0);
  part(new THREE.BoxGeometry(0.07,0.035,0.035),neon,side*0.40,2.00,-0.04,player,neon);
}

// BRACOS EM POSICAO DE SEGURAR O RIFLE
const armL = new THREE.Group();
armL.position.set(-0.40,1.48,0);
armL.rotation.x=Math.PI/2;
player.add(armL);

const armR = new THREE.Group();
armR.position.set(0.40,1.48,0);
armR.rotation.x=Math.PI/2;
player.add(armR);

for(const arm of [armL,armR]) {
  part(new THREE.CylinderGeometry(0.13,0.15,0.62,10),armorLight,0,-0.27,0,arm);
  part(new THREE.CylinderGeometry(0.14,0.14,0.12,10),black,0,-0.53,0,arm);
  part(new THREE.SphereGeometry(0.14,10,8),black,0,-0.62,-0.08,arm);
  part(new THREE.BoxGeometry(0.16,0.06,0.12),neon,0,-0.55,-0.09,arm,neon);
}

// RIFLE FUTURISTA: OBJETO FICTICIO DO JOGO
part(new THREE.BoxGeometry(0.18,0.17,0.78),black,0.08,1.20,-0.63);
part(new THREE.BoxGeometry(0.24,0.22,0.28),armorLight,0.08,1.21,-0.39);
part(new THREE.BoxGeometry(0.10,0.10,0.43),metal,0.08,1.23,-1.18);
part(new THREE.BoxGeometry(0.12,0.08,0.16),neon,0.08,1.31,-0.82,player,neon);
part(new THREE.BoxGeometry(0.12,0.27,0.14),black,0.08,1.00,-0.42);
part(new THREE.BoxGeometry(0.11,0.12,0.18),armor,0.08,1.06,-0.70);

player.position.set(0,0,0);

// JOYSTICK
const pad=document.getElementById('pad');
const stick=document.getElementById('stick');

let moveX=0;
let moveZ=0;
let pointer=null;

pad.addEventListener('pointerdown',e=>{
  pointer=e.pointerId;
  pad.setPointerCapture(pointer);
  updateStick(e);
});

pad.addEventListener('pointermove',e=>{
  if(pointer===e.pointerId) updateStick(e);
});

function updateStick(e) {
  const r=pad.getBoundingClientRect();
  let x=e.clientX-(r.left+r.width/2);
  let y=e.clientY-(r.top+r.height/2);
  const max=36;
  const len=Math.hypot(x,y);

  if(len>max) {
    x*=max/len;
    y*=max/len;
  }

  stick.style.transform=`translate(${x}px,${y}px)`;
  moveX=x/max;
  moveZ=y/max;
}

function resetStick() {
  pointer=null;
  moveX=0;
  moveZ=0;
  stick.style.transform='translate(0px,0px)';
}

pad.addEventListener('pointerup',resetStick);
pad.addEventListener('pointercancel',resetStick);

// TECLADO
const keys={};

addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
});

addEventListener('keyup',e=>{
  keys[e.key.toLowerCase()]=false;
});

// MOVIMENTO E CAMERA
function animate() {
  requestAnimationFrame(animate);

  let x=moveX;
  let z=moveZ;

  if(keys['w']||keys['arrowup']) z=-1;
  if(keys['s']||keys['arrowdown']) z=1;
  if(keys['a']||keys['arrowleft']) x=-1;
  if(keys['d']||keys['arrowright']) x=1;

  const length=Math.hypot(x,z);
  const moving=length>0.1;

  if(moving) {
    x/=Math.max(1,length);
    z/=Math.max(1,length);

    player.position.x+=x*0.09;
    player.position.z+=z*0.09;
    player.rotation.y=Math.atan2(-x,-z);
  }

  const time=performance.now()*0.012;

  if(moving) {
    legL.rotation.x=Math.sin(time)*0.65;
    legR.rotation.x=Math.sin(time+Math.PI)*0.65;
    player.position.y=Math.abs(Math.sin(time*2))*0.035;
  } else {
    legL.rotation.x=0;
    legR.rotation.x=0;
    player.position.y=0;
  }

  camera.position.x+=(player.position.x-camera.position.x)*0.06;
  camera.position.z+=(player.position.z+15-camera.position.z)*0.06;
  camera.lookAt(player.position.x,0,player.position.z);

  renderer.render(scene,camera);
}

animate();

// REDIMENSIONAR
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
