
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mini Royale</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  overflow: hidden;
  background: #18251d;
  font-family: Arial, sans-serif;
  touch-action: none;
}
canvas { display: block; }
#title {
  position: fixed;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  color: white;
  font-weight: bold;
  font-size: 22px;
  text-shadow: 2px 2px 4px black;
  z-index: 2;
}
#pad {
  position: fixed;
  bottom: 25px;
  left: 25px;
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: #ffffff40;
  border: 2px solid #ffffff80;
  z-index: 3;
  touch-action: none;
}
#stick {
  position: absolute;
  width: 48px;
  height: 48px;
  left: 34px;
  top: 34px;
  border-radius: 50%;
  background: #eeeeeecc;
  border: 2px solid white;
}
#hint {
  position: fixed;
  bottom: 12px;
  right: 15px;
  color: white;
  font-size: 12px;
  text-shadow: 1px 1px 3px black;
}
</style>
</head>
<body>

<div id="title">MINI ROYALE</div>
<div id="pad"><div id="stick"></div></div>
<div id="hint">Arraste o joystick para andar</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// CENA
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9bc9dc);

const camera = new THREE.PerspectiveCamera(
  48, innerWidth / innerHeight, 0.1, 200
);
camera.position.set(0, 15, 15);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// LUZES
scene.add(new THREE.HemisphereLight(0xffffff, 0x536344, 2));

const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.position.set(8, 15, 8);
sun.castShadow = true;
scene.add(sun);

// CHÃO
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(50, 50),
  new THREE.MeshStandardMaterial({color:0x559447})
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// CAMINHO
const path = new THREE.Mesh(
  new THREE.PlaneGeometry(8, 50),
  new THREE.MeshStandardMaterial({color:0xb5a078})
);
path.rotation.x = -Math.PI / 2;
path.position.set(0, 0.02, 0);
scene.add(path);

// OBJETOS
function box(x,y,z,sx,sy,sz,color) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(sx,sy,sz),
    new THREE.MeshStandardMaterial({color})
  );
  mesh.position.set(x,y,z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

// ÁRVORES
function tree(x,z) {
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.18,0.25,1.4,7),
    new THREE.MeshStandardMaterial({color:0x70452a})
  );
  trunk.position.set(x,0.7,z);
  trunk.castShadow = true;
  scene.add(trunk);

  const leaves = new THREE.Mesh(
    new THREE.ConeGeometry(1.15,2.5,7),
    new THREE.MeshStandardMaterial({color:0x236b35})
  );
  leaves.position.set(x,2.35,z);
  leaves.castShadow = true;
  scene.add(leaves);
}

[
 [-10,-9],[-13,-3],[-10,7],[-13,13],
 [10,-10],[13,-4],[11,6],[14,13],
 [-7,15],[7,16],[-16,5],[16,4]
].forEach(p => tree(p[0],p[1]));

// CASAS
function house(x,z,color) {
  box(x,1,z,4,2,4,color);

  const roof = new THREE.Mesh(
    new THREE.ConeGeometry(3.1,2,4),
    new THREE.MeshStandardMaterial({color:0x713c2c})
  );
  roof.position.set(x,3,z);
  roof.rotation.y = Math.PI/4;
  roof.castShadow = true;
  scene.add(roof);

  box(x,0.9,z+2.02,0.9,1.8,0.08,0x49301e);
}

house(-7,-5,0xd7c18c);
house(8,7,0xc5b28a);
house(7,-10,0xb9c4a0);

// PEDRAS
for(let i=0;i<12;i++) {
  const rock = new THREE.Mesh(
    new THREE.DodecahedronGeometry(0.5+Math.random()*0.5),
    new THREE.MeshStandardMaterial({color:0x777b70})
  );
  rock.position.set(
    (Math.random()-0.5)*35,
    0.35,
    (Math.random()-0.5)*35
  );
  rock.castShadow = true;
  scene.add(rock);
}

// PERSONAGEM 3D CARTOON
const player = new THREE.Group();
scene.add(player);

function part(geometry,color,x,y,z,parent=player) {
  const mesh = new THREE.Mesh(
    geometry,
    new THREE.MeshStandardMaterial({color})
  );
  mesh.position.set(x,y,z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

const uniform = 0x405b39;
const dark = 0x26372a;
const skin = 0xd6a477;
const boots = 0x292b25;
const detail = 0x718052;

// TRONCO DO UNIFORME
part(
  new THREE.BoxGeometry(0.76,0.82,0.42),
  uniform,0,1.22,0
);

// GOLA
part(
  new THREE.CylinderGeometry(0.15,0.17,0.16,10),
  dark,0,1.67,0
);

// DETALHES DOS OMBROS
part(
  new THREE.SphereGeometry(0.22,10,8),
  uniform,-0.39,1.48,0
);
part(
  new THREE.SphereGeometry(0.22,10,8),
  uniform,0.39,1.48,0
);

// BOLSO DO PEITO
part(
  new THREE.BoxGeometry(0.22,0.19,0.06),
  detail,-0.20,1.37,-0.23
);
part(
  new THREE.BoxGeometry(0.22,0.19,0.06),
  detail,0.20,1.37,-0.23
);

// BOTÕES DO UNIFORME
for(let i=0;i<3;i++) {
  part(
    new THREE.SphereGeometry(0.025,8,6),
    0x252c20,0.02,1.42-i*0.17,-0.225
  );
}

// CINTO MILITAR
part(
  new THREE.BoxGeometry(0.78,0.12,0.46),
  dark,0,0.88,0
);

// FIVELA
part(
  new THREE.BoxGeometry(0.14,0.10,0.035),
  0xb49b55,0,0.88,-0.25
);

// BOLSOS LATERAIS DO CINTO
part(
  new THREE.BoxGeometry(0.18,0.20,0.16),
  detail,-0.43,0.88,0
);
part(
  new THREE.BoxGeometry(0.18,0.20,0.16),
  detail,0.43,0.88,0
);

// PERNAS ARTICULADAS
const legL = new THREE.Group();
legL.position.set(-0.22,0.8,0);
player.add(legL);

const legR = new THREE.Group();
legR.position.set(0.22,0.8,0);
player.add(legR);

for (const leg of [legL,legR]) {
  // CALÇA
  part(
    new THREE.CylinderGeometry(0.16,0.17,0.65,10),
    uniform,0,-0.32,0,leg
  );

  // BOLSO LATERAL
  part(
    new THREE.BoxGeometry(0.22,0.24,0.10),
    detail,0.12,-0.30,-0.02,leg
  );

  // JOELHEIRA
  part(
    new THREE.BoxGeometry(0.29,0.18,0.12),
    dark,0,-0.49,-0.13,leg
  );

  // DETALHE DA JOELHEIRA
  part(
    new THREE.BoxGeometry(0.20,0.06,0.025),
    detail,0,-0.49,-0.195,leg
  );

  // CANELA
  part(
    new THREE.CylinderGeometry(0.14,0.15,0.25,10),
    uniform,0,-0.57,0,leg
  );

  // BOTA
  part(
    new THREE.BoxGeometry(0.32,0.20,0.42),
    boots,0,-0.68,-0.08,leg
  );

  // SOLA DA BOTA
  part(
    new THREE.BoxGeometry(0.33,0.055,0.43),
    0x171b16,0,-0.78,-0.08,leg
  );
}

// CABEÇA
part(
  new THREE.SphereGeometry(0.34,16,12),
  skin,0,1.85,0
);

// PESCOÇO
part(
  new THREE.CylinderGeometry(0.12,0.13,0.18,10),
  skin,0,1.65,0
);

// CAPACETE
part(
  new THREE.SphereGeometry(
    0.39,16,10,0,Math.PI*2,0,Math.PI/2
  ),
  0x40552e,0,2.04,0
);

part(
  new THREE.CylinderGeometry(0.4,0.4,0.09,16),
  0x344629,0,1.99,0
);

// DETALHE DO CAPACETE
part(
  new THREE.BoxGeometry(0.18,0.07,0.06),
  0x718052,0,2.12,-0.34
);

// BRAÇOS ARTICULADOS
const armL = new THREE.Group();
armL.position.set(-0.42,1.48,0);
player.add(armL);

const armR = new THREE.Group();
armR.position.set(0.42,1.48,0);
player.add(armR);

for (const arm of [armL,armR]) {
  // MANGA
  part(
    new THREE.CylinderGeometry(0.13,0.15,0.65,10),
    uniform,0,-0.28,0,arm
  );

  // PUNHO
  part(
    new THREE.CylinderGeometry(0.13,0.13,0.12,10),
    dark,0,-0.55,0,arm
  );

  // LUVA
  part(
    new THREE.SphereGeometry(0.14,10,8),
    dark,0,-0.62,-0.08,arm
  );
}

// RIFLE VISUAL
part(
  new THREE.BoxGeometry(0.14,0.14,0.85),
  0x292929,0.28,1.05,-0.48
);

part(
  new THREE.BoxGeometry(0.19,0.2,0.25),
  0x414141,0.28,1.05,-0.2
);

part(
  new THREE.BoxGeometry(0.1,0.32,0.12),
  0x292929,0.28,0.83,-0.25
);

player.position.set(0,0,0);

// JOYSTICK
const pad = document.getElementById('pad');
const stick = document.getElementById('stick');

let moveX = 0;
let moveZ = 0;
let pointer = null;

pad.addEventListener('pointerdown',e => {
  pointer = e.pointerId;
  pad.setPointerCapture(pointer);
  updateStick(e);
});

pad.addEventListener('pointermove',e => {
  if(pointer === e.pointerId) updateStick(e);
});

function updateStick(e) {
  const r = pad.getBoundingClientRect();

  let x = e.clientX - (r.left + r.width/2);
  let y = e.clientY - (r.top + r.height/2);

  const max = 36;
  const len = Math.hypot(x,y);

  if(len > max) {
    x *= max/len;
    y *= max/len;
  }

  stick.style.transform = `translate(${x}px,${y}px)`;
  moveX = x/max;
  moveZ = y/max;
}

function resetStick() {
  pointer = null;
  moveX = 0;
  moveZ = 0;
  stick.style.transform = 'translate(0px,0px)';
}

pad.addEventListener('pointerup',resetStick);
pad.addEventListener('pointercancel',resetStick);

// TECLADO
const keys = {};

addEventListener('keydown',e => {
  keys[e.key.toLowerCase()] = true;
});

addEventListener('keyup',e => {
  keys[e.key.toLowerCase()] = false;
});

// MOVIMENTO E CÂMERA
function animate() {
  requestAnimationFrame(animate);

  let x = moveX;
  let z = moveZ;

  if(keys['w'] || keys['arrowup']) z = -1;
  if(keys['s'] || keys['arrowdown']) z = 1;
  if(keys['a'] || keys['arrowleft']) x = -1;
  if(keys['d'] || keys['arrowright']) x = 1;

  const length = Math.hypot(x,z);
  const moving = length > 0.1;

  if(moving) {
    x /= Math.max(1,length);
    z /= Math.max(1,length);

    player.position.x += x*0.09;
    player.position.z += z*0.09;

    player.rotation.y = Math.atan2(-x,-z);
  }

  const time = performance.now() * 0.012;

  if(moving) {
    legL.rotation.x = Math.sin(time) * 0.65;
    legR.rotation.x = Math.sin(time + Math.PI) * 0.65;

    armL.rotation.x = Math.sin(time + Math.PI) * 0.35;
    armR.rotation.x = Math.sin(time) * 0.35;

    player.position.y = Math.abs(Math.sin(time*2))*0.035;
  } else {
    legL.rotation.x = 0;
    legR.rotation.x = 0;
    armL.rotation.x = 0;
    armR.rotation.x = 0;
    player.position.y = 0;
  }

  camera.position.x +=
    (player.position.x-camera.position.x)*0.06;

  camera.position.z +=
    (player.position.z+15-camera.position.z)*0.06;

  camera.lookAt(player.position.x,0,player.position.z);

  renderer.render(scene,camera);
}

animate();

// REDIMENSIONAR
addEventListener('resize',() => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

</script>
</body>
</html>
