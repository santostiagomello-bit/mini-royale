<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SKY BATTLE ROYALE</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #5fa866; touch-action: none; }
canvas { display: block; background: #5fa866; }

#startScreen, #gameOverScreen, #dropScreen {
  position: fixed; inset: 0; z-index: 100;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #1e40af, #166534); color: white;
}
#dropScreen { background: linear-gradient(180deg, #38bdf8, #5fa866); display: none; }
#startScreen h1 { font-size: clamp(36px, 10vw, 64px); margin-bottom: 10px; text-shadow: 0 4px 12px rgba(0,0,0,0.4); }
#startScreen p { font-size: 18px; opacity: 0.8; margin-bottom: 40px; text-align: center; max-width: 320px; }
.btn { background: #eab308; border: none; color: #000; font-size: 22px; font-weight: bold; padding: 14px 40px; border-radius: 12px; cursor: pointer; box-shadow: 0 5px 0 #a16207; transition: all 0.1s; }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #a16207; }
.small-btn { font-size: 16px; padding: 10px 24px; background: #22c55e; box-shadow: 0 4px 0 #15803d; margin-top: 20px; }
.copyright { position: absolute; bottom: 20px; font-size: 11px; opacity: 0.5; text-align: center; line-height: 1.5; padding: 0 20px; }

#hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
.top-bar { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.panel { background: rgba(0,0,0,0.6); padding: 8px 14px; border-radius: 10px; font-size: 14px; font-weight: bold; backdrop-filter: blur(4px); }
.health-bar { width: 140px; height: 16px; background: #333; border-radius: 8px; overflow: hidden; border: 2px solid white; margin-top: 5px; }
.health-fill { height: 100%; background: linear-gradient(90deg, #ef4444, #22c55e); width: 100%; transition: width 0.2s; }
.zone-timer { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); font-size: 20px; font-weight: bold; color: #fbbf24; text-shadow: 0 0 6px rgba(0,0,0,0.6); }
.minimap { position: absolute; top: 12px; right: 12px; width: 140px; height: 140px; background: rgba(0,0,0,0.5); border-radius: 10px; border: 2px solid white; overflow: hidden; }

#joystick { position: absolute; bottom: 40px; left: 30px; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,0.25); border: 3px solid rgba(255,255,255,0.5); pointer-events: auto; touch-action: none; }
#stick { position: absolute; width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,0.7); border: 2px solid white; left: 36px; top: 36px; }
.shoot-btn { position: absolute; bottom: 45px; right: 30px; width: 70px; height: 70px; border-radius: 50%; background: rgba(239,68,68,0.6); border: 3px solid #fca5a5; color: white; font-size: 24px; font-weight: bold; display: flex; align-items: center; justify-content: center; pointer-events: auto; cursor: pointer; }

.item-icon { position: absolute; bottom: 130px; right: 30px; display: flex; gap: 8px; pointer-events: auto; }
.slot { width: 50px; height: 50px; background: rgba(0,0,0,0.5); border-radius: 8px; border: 2px solid white; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer; }
.slot:hover { background: rgba(255,255,255,0.2); }

.hidden { display: none !important; }
</style>
</head>
<body>

<div id="startScreen">
  <h1>🪂 SKY BATTLE ROYALE</h1>
  <p>Pule de paraquedas • Saqueie itens • Derrote inimigos<br>Seja o último sobrevivente!</p>
  <button class="btn" id="playBtn">JOGAR</button>
  <div class="copyright">
    © 2026 Sky Battle Royale<br>
    Jogo criado com ❤️ — Projeto independente
  </div>
</div>

<div id="dropScreen">
  <h1>🪂 PULE DE PARAQUEDAS!</h1>
  <p>Escolha onde cair no mapa</p>
  <button class="btn small-btn" id="landBtn">Pousar Agora</button>
</div>

<div id="gameOverScreen" class="hidden">
  <h1 id="endTitle">FIM DE JOGO</h1>
  <p id="endStats"></p>
  <button class="btn" id="retryBtn">JOGAR NOVAMENTE</button>
</div>

<canvas id="gameCanvas"></canvas>

<div id="hud" class="hidden">
  <div class="top-bar">
    <div class="panel">
      ❤️ Vida
      <div class="health-bar"><div class="health-fill" id="healthBar"></div></div>
    </div>
    <div class="panel">
      👥 <span id="playerCount">8</span> jogadores
      <br>💀 Eliminações: <span id="killCount">0</span>
    </div>
  </div>
  <div class="zone-timer" id="zoneTimer">Zona segura estável</div>
  <canvas class="minimap" id="minimap"></canvas>
  
  <div class="item-icon">
    <div class="slot" id="weaponSlot">🔫</div>
    <div class="slot" id="medkitSlot" title="Clique para usar">❌</div>
  </div>
  
  <div id="joystick"><div id="stick"></div></div>
  <div class="shoot-btn" id="shootBtn">🎯</div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const minimap = document.getElementById('minimap');
const minimapCtx = minimap.getContext('2d');

const startScreen = document.getElementById('startScreen');
const dropScreen = document.getElementById('dropScreen');
const gameOverScreen = document.getElementById('gameOverScreen');
const hud = document.getElementById('hud');
const healthBar = document.getElementById('healthBar');
const playerCountEl = document.getElementById('playerCount');
const killCountEl = document.getElementById('killCount');
const zoneTimerEl = document.getElementById('zoneTimer');
const medkitSlot = document.getElementById('medkitSlot');

document.getElementById('playBtn').onclick = startGame;
document.getElementById('landBtn').onclick = landPlayer;
document.getElementById('retryBtn').onclick = () => {
  gameOverScreen.classList.add('hidden');
  startScreen.style.display = 'flex';
};
medkitSlot.onclick = () => { if(player && player.hasMedkit) player.useMedkit(); };

const MAP_SIZE = 1600;
const PLAYER_RADIUS = 18;
const BULLET_SPEED = 8;
const PLAYER_SPEED = 2.5;
const PARACHUTE_SPEED = 1.2;
const ZONE_SHRINK_TIME = 30;

let gameState = 'menu';
let camera = { x: 0, y: 0 };
let player = null;
let enemies = [];
let bullets = [];
let items = [];
let obstacles = [];
let zone = { x: MAP_SIZE/2, y: MAP_SIZE/2, radius: 700, nextRadius: 200, timer: ZONE_SHRINK_TIME };
let joystick = { active: false, dx: 0, dy: 0 };
let mouse = { x: 0, y: 0, down: false };
let kills = 0;
let lastTime = 0;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  minimap.width = 140;
  minimap.height = 140;
}
window.addEventListener('resize', resize);
resize();

function dist(x1, y1, x2, y2) {
  return Math.hypot(x2 - x1, y2 - y1);
}

function checkWin() {
  const alive = enemies.filter(e => e.alive).length;
  playerCountEl.textContent = alive + 1;
  if (alive === 0 && player.alive) gameOver(true);
}

function gameOver(won) {
  gameState = 'gameover';
  gameOverScreen.style.display = 'flex';
  document.getElementById('endTitle').textContent = won ? '🏆 VITÓRIA! Você é o campeão!' : '💀 Você foi eliminado';
  document.getElementById('endStats').textContent = `Eliminações: ${kills}`;
}

class Player {
  constructor(x, y, isPlayer = false) {
    this.x = x; this.y = y;
    this.vx = 0; this.vy = 0;
    this.health = 100; this.maxHealth = 100;
    this.isPlayer = isPlayer;
    this.alive = true;
    this.angle = Math.random() * Math.PI * 2;
    this.color = isPlayer ? '#facc15' : `hsl(${Math.random()*360}, 75%, 50%)`;
    this.shootCooldown = 0;
    this.weapon = { name: 'Pistola', damage: 15, fireRate: 12, range: 300 };
    this.hasMedkit = false;
    this.isDropping = isPlayer;
    this.dropY = -100;
  }

  update(dt) {
    if (!this.alive) return;

    if (this.isDropping) {
      this.dropY += PARACHUTE_SPEED;
      if (this.dropY >= 0) {
        this.dropY = 0;
        this.isDropping = false;
      }
      if (this.isPlayer) {
        this.x += joystick.dx * 2;
        this.y += joystick.dy * 2;
      } else {
        this.x += Math.sin(Date.now()/800 + this.x) * 0.8;
        this.y += Math.cos(Date.now()/800 + this.y) * 0.8;
      }
      this.x = Math.max(50, Math.min(MAP_SIZE-50, this.x));
      this.y = Math.max(50, Math.min(MAP_SIZE-50, this.y));
      return;
    }

    if (!this.inZone()) this.health -= 20 * dt;

    if (this.isPlayer) {
      this.vx = joystick.dx * PLAYER_SPEED;
      this.vy = joystick.dy * PLAYER_SPEED;
      if (Math.abs(this.vx) > 0.1 || Math.abs(this.vy) > 0.1) {
        this.angle = Math.atan2(this.vy, this.vx);
      }
      if (mouse.down) {
        const worldX = mouse.x + camera.x;
        const worldY = mouse.y + camera.y;
        this.angle = Math.atan2(worldY - this.y, worldX - this.x);
      }
    } else {
      this.updateAI(dt);
    }

    this.x += this.vx;
    this.y += this.vy;
    this.x = Math.max(PLAYER_RADIUS, Math.min(MAP_SIZE - PLAYER_RADIUS, this.x));
    this.y = Math.max(PLAYER_RADIUS, Math.min(MAP_SIZE - PLAYER_RADIUS, this.y));

    for (const obs of obstacles) {
      if (dist(this.x, this.y, obs.x, obs.y) < obs.radius + PLAYER_RADIUS) {
        const ang = Math.atan2(this.y - obs.y, this.x - obs.x);
        this.x = obs.x + Math.cos(ang) * (obs.radius + PLAYER_RADIUS);
        this.y = obs.y + Math.sin(ang) * (obs.radius + PLAYER_RADIUS);
      }
    }

    if (this.isPlayer) this.collectItems();

    this.shootCooldown -= dt * 60;
    if (this.isPlayer && mouse.down && this.shootCooldown <= 0) {
      this.fire();
      this.shootCooldown = this.weapon.fireRate;
    }
  }

  updateAI(dt) {
    let nearest = null, minDist = this.weapon.range;
    for (const p of [player, ...enemies]) {
      if (p === this || !p.alive || p.isDropping) continue;
      const d = dist(this.x, this.y, p.x, p.y);
      if (d < minDist) { minDist = d; nearest = p; }
    }

    if (nearest) {
      const ang = Math.atan2(nearest.y - this.y, nearest.x - this.x);
      this.angle = ang;
      if (minDist < this.weapon.range * 0.8) {
        this.vx = 0; this.vy = 0;
        if (this.shootCooldown <= 0) {
          this.fireAt(nearest);
          this.shootCooldown = this.weapon.fireRate + Math.random() * 20;
        }
      } else {
        this.vx = Math.cos(ang) * PLAYER_SPEED * 0.7;
        this.vy = Math.sin(ang) * PLAYER_SPEED * 0.7;
      }
    } else {
      if (Math.random() < 0.02) this.wander = Math.random() * Math.PI * 2;
      const distToZone = dist(this.x, this.y, zone.x, zone.y);
      if (distToZone > zone.radius * 0.7) {
        this.wander = Math.atan2(zone.y - this.y, zone.x - this.x);
      }
      this.vx = Math.cos(this.wander || 0) * PLAYER_SPEED * 0.4;
      this.vy = Math.sin(this.wander || 0) * PLAYER_SPEED * 0.4;
    }
  }

  fire() {
    bullets.push({
      x: this.x, y: this.y,
      vx: Math.cos(this.angle) * BULLET_SPEED,
      vy: Math.sin(this.angle) * BULLET_SPEED,
      owner: this, damage: this.weapon.damage, life: 80
    });
  }

  fireAt(target) {
    this.angle = Math.atan2(target.y - this.y, target.x - this.x);
    this.fire();
  }

  collectItems() {
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      if (dist(this.x, this.y, it.x, it.y) < 30) {
        this.pickup(it);
        items.splice(i, 1);
      }
    }
  }

  pickup(item) {
    switch (item.type) {
      case 'health':
        this.health = Math.min(this.maxHealth, this.health + 35);
        break;
      case 'medkit':
        this.hasMedkit = true;
        medkitSlot.textContent = '🩹';
        break;
      case 'ammo':
        this.weapon.damage = Math.min(30, this.weapon.damage + 3);
        break;
    }
  }

  useMedkit() {
    if (this.hasMedkit && this.health < this.maxHealth) {
      this.health = Math.min(this.maxHealth, this.health + 50);
      this.hasMedkit = false;
      medkitSlot.textContent = '❌';
    }
  }

  inZone() {
    return dist(this.x, this.y, zone.x, zone.y) < zone.radius;
  }

  takeDamage(amount, from) {
    this.health -= amount;
    if (this.health <= 0 && this.alive) {
      this.alive = false;
      if (from && from.isPlayer) kills++;
      if (this.isPlayer) gameOver(false);
      else checkWin();
    }
  }

  draw() {
    if (!this.alive) return;
    const sx = this.x - camera.x;
    const sy = this.y - camera.y;

    if (this.isDropping) {
      ctx.save();
      ctx.translate(sx, sy - this.dropY * 0.8 - 40);
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.lineWidth = 1.5;
      for (let i = -2; i <= 2; i++) {
        ctx.beginPath();
        ctx.moveTo(i * 6, 15);
        ctx.lineTo(0, 40);
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.moveTo(-35, 20);
      ctx.quadraticCurveTo(0, -15, 35, 20);
      ctx.lineTo(0, 15);
      ctx.closePath();
      ctx.fillStyle = this.isPlayer ? '#facc15' : '#f87171';
      ctx.fill();
      ctx.strokeStyle = 'white';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
    }

    if (!this.inZone() && !this.isDropping) {
      ctx.beginPath();
      ctx.arc(sx, sy, PLAYER_RADIUS + 6, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(239,68,68,0.7)';
      ctx.lineWidth = 3;
      ctx.stroke();
    }

    ctx.beginPath();
    ctx.arc(sx, sy, PLAYER_RADIUS, 0, Math.PI * 2);
    ctx.fillStyle = this.color;
    ctx.fill();
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.arc(sx - 5, sy - 4, 3.5, 0, Math.PI * 2);
    ctx.arc(sx + 5, sy - 4, 3.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(sx - 4, sy - 4, 1.8, 0, Math.PI * 2);
    ctx.arc(sx + 6, sy - 4, 1.8, 0, Math.PI * 2);
    ctx.fill();

    if (!this.isDropping) {
      ctx.save();
      ctx.translate(sx, sy);
      ctx.rotate(this.angle);
      ctx.fillStyle = '#333';
      ctx.fillRect(PLAYER_RADIUS - 4, -3, 16, 6);
      ctx.restore();
    }

    if (!this.isPlayer) {
      const bw = 28, bh = 4;
      const hp = Math.max(0, this.health / this.maxHealth);
      ctx.fillStyle = '#444';
      ctx.fillRect(sx - bw/2, sy - PLAYER_RADIUS - 10, bw, bh);
      ctx.fillStyle = hp > 0.3 ? '#22c55e' : '#ef4444';
      ctx.fillRect(sx - bw/2, sy - PLAYER_RADIUS - 10, bw * hp, bh);
    }
  }
}

function spawnEnemies(count) {
  enemies = [];
  for (let i = 0; i < count; i++) {
    let x, y, attempts = 0;
    do {
      x = 100 + Math.random() * (MAP_SIZE - 200);
      y = 100 + Math.random() * (MAP_SIZE - 200);
      attempts++;
    } while (dist(x, y, MAP_SIZE/2, MAP_SIZE/2) < 300 && attempts < 50);
